<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0b0d"/>
<title>WebStreamer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; background: #0a0b0d; font-family: "Inter Tight", system-ui, sans-serif; color: #eef0f2; }
  body { overscroll-behavior-y: none; }
  * { box-sizing: border-box; }

  /* Scroll containers — momentum, GPU promotion, contained chaining. */
  .ws-scroll {
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    scroll-behavior: auto;          /* native, not smooth — instant response on flick */
    transform: translateZ(0);        /* promote to its own compositor layer */
    will-change: scroll-position;
    backface-visibility: hidden;
    touch-action: pan-y;             /* hint browser: vertical-scroll only, fast path */
  }
  .ws-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .ws-scroll::-webkit-scrollbar-track { background: transparent; }
  .ws-scroll::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
  }
  .ws-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }

  /* Cards skip render work when offscreen so long lists scroll cheap. */
  .ws-card {
    content-visibility: auto;
    contain-intrinsic-size: 0 220px; /* approx card height; prevents layout pop */
  }

  /* Boot loading screen */
  @keyframes ws-boot-pulse {
    0%, 100% { transform: scale(1); opacity: 0.55; }
    50% { transform: scale(1.18); opacity: 0.95; }
  }
  @keyframes ws-boot-ring {
    0%   { transform: scale(0.6); opacity: 0.7; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  @keyframes ws-boot-spin { to { transform: rotate(360deg); } }
  @keyframes ws-boot-shimmer {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(110%); }
  }
  @keyframes ws-boot-grid-drift {
    0%   { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(40px, 40px, 0); }
  }
  @keyframes ws-boot-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes ws-boot-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  @keyframes ws-toast-in {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  @keyframes ws-stats-in {
    from { opacity: 0; transform: translateY(-8px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<div id="ws-boot" style="position:fixed;inset:0;z-index:9999;background:radial-gradient(120% 80% at 50% 35%, #11141a 0%, #07080a 60%, #050608 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:'Inter Tight',system-ui,sans-serif;color:#eef0f2;opacity:1;transform:scale(1);transition:opacity .55s ease, transform .65s cubic-bezier(.2,.7,.2,1);">
  <div style="position:absolute;inset:-60px;background-image:linear-gradient(rgba(0,220,130,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,220,130,0.08) 1px,transparent 1px);background-size:40px 40px;animation:ws-boot-grid-drift 8s linear infinite;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 45%,#000 0%,transparent 70%);opacity:0.6;"></div>
  <div style="position:relative;width:96px;height:96px;margin-bottom:28px;">
    <div style="position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(0,220,130,0.45);animation:ws-boot-ring 2.4s 0s ease-out infinite;"></div>
    <div style="position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(0,220,130,0.45);animation:ws-boot-ring 2.4s 0.6s ease-out infinite;"></div>
    <div style="position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(0,220,130,0.45);animation:ws-boot-ring 2.4s 1.2s ease-out infinite;"></div>
    <div style="position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0%,transparent 70%,rgba(0,220,130,0.85) 90%,transparent 100%);animation:ws-boot-spin 1.6s linear infinite;-webkit-mask-image:radial-gradient(circle,transparent 56%,#000 58%,#000 100%);mask-image:radial-gradient(circle,transparent 56%,#000 58%,#000 100%);"></div>
    <div style="position:absolute;inset:22px;border-radius:14px;background:linear-gradient(135deg,oklch(0.78 0.19 155),oklch(0.55 0.14 165));box-shadow:0 0 40px rgba(0,220,130,0.55),0 0 80px rgba(0,220,130,0.25);animation:ws-boot-pulse 2.2s ease-in-out infinite;display:flex;align-items:center;justify-content:center;">
      <div style="width:16px;height:16px;border-radius:4px;background:#07080a;"></div>
    </div>
  </div>
  <div style="font-size:28px;font-weight:700;letter-spacing:-0.02em;margin-bottom:6px;">WebStreamer</div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.42em;color:rgba(0,220,130,0.85);text-transform:uppercase;margin-bottom:36px;">Live · Sports · Streaming</div>
  <div style="position:relative;width:min(320px,70vw);height:2px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;">
    <div id="ws-boot-bar" style="position:absolute;top:0;left:0;height:100%;width:4%;background:linear-gradient(90deg,oklch(0.55 0.14 165),oklch(0.78 0.19 155));box-shadow:0 0 12px rgba(0,220,130,0.6);will-change:width;"></div>
    <div style="position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.55),transparent);animation:ws-boot-shimmer 1.6s ease-in-out infinite;"></div>
  </div>
  <div id="ws-boot-status" style="margin-top:20px;position:relative;width:100%;height:20px;overflow:hidden;">
    <div class="ws-boot-line" style="position:absolute;top:0;left:50%;height:100%;display:flex;align-items:center;gap:10px;white-space:nowrap;transform:translateX(-50%) translateY(0);opacity:1;transition:opacity .32s ease, transform .32s ease;">
      <div style="width:6px;height:6px;border-radius:50%;background:oklch(0.78 0.19 155);animation:ws-boot-blink 1.1s ease-in-out infinite;box-shadow:0 0 8px oklch(0.78 0.19 155);flex-shrink:0;"></div>
      <span class="ws-boot-label" style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;">INITIALIZING</span>
      <span class="ws-boot-sub" style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.05em;color:rgba(238,240,242,0.45);">· Starting WebStreamer engine</span>
    </div>
  </div>
  <div style="position:absolute;bottom:24px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.32em;color:rgba(238,240,242,0.28);text-transform:uppercase;">v1.0 · powered by streamed.pk</div>
</div>

<script>
(function () {
  // Boot loader driven by vanilla JS so React mounting doesn't restart it.
  // The React app signals readiness via window.WS_BOOT.signal({ stage, matchCount, error }).
  var STAGES = [
    { label: 'INITIALIZING',     sub: 'Starting WebStreamer engine' },
    { label: 'CONNECTING',       sub: 'Reaching streamed.pk' },
    { label: 'INDEXING SOURCES', sub: 'Loading match catalog' },
    { label: 'READY',            sub: 'Tuning into live feeds' }
  ];
  var DWELL_MS = 380, FADE_MS = 320, MIN_MS = 1400, CAP_MS = 6500;
  var bar     = document.getElementById('ws-boot-bar');
  var statusEl= document.getElementById('ws-boot-status');
  var rootEl  = document.getElementById('ws-boot');
  if (!bar || !statusEl || !rootEl) return;

  var realStage = 0, displayStage = 0, matchCount = 0, errored = false;
  var leaving = false, finished = false, t0 = performance.now();
  var pct = 4, lastTickStageChange = t0;

  function setLine(label, sub) {
    var lines = statusEl.querySelectorAll('.ws-boot-line');
    var current = lines[lines.length - 1];
    if (current
        && current.querySelector('.ws-boot-label').textContent === label
        && current.querySelector('.ws-boot-sub').textContent.replace(/^· /, '') === sub) return;
    var dotColor = errored ? '#ff8c66' : 'oklch(0.78 0.19 155)';
    var next = document.createElement('div');
    next.className = 'ws-boot-line';
    next.style.position = 'absolute';
    next.style.top = '0';
    next.style.left = '50%';
    next.style.height = '100%';
    next.style.display = 'flex';
    next.style.alignItems = 'center';
    next.style.gap = '10px';
    next.style.whiteSpace = 'nowrap';
    next.style.transform = 'translateX(-50%) translateY(3px)';
    next.style.opacity = '0';
    next.style.transition = 'opacity ' + FADE_MS + 'ms ease, transform ' + FADE_MS + 'ms ease';

    var dot = document.createElement('div');
    dot.style.width = '6px';
    dot.style.height = '6px';
    dot.style.borderRadius = '50%';
    dot.style.background = dotColor;
    dot.style.boxShadow = '0 0 8px ' + dotColor;
    dot.style.animation = 'ws-boot-blink 1.1s ease-in-out infinite';
    dot.style.flexShrink = '0';
    next.appendChild(dot);

    var labelEl = document.createElement('span');
    labelEl.className = 'ws-boot-label';
    labelEl.style.fontFamily = '"JetBrains Mono", monospace';
    labelEl.style.fontSize = '11px';
    labelEl.style.letterSpacing = '0.18em';
    labelEl.style.color = '#eef0f2';
    labelEl.style.textTransform = 'uppercase';
    labelEl.textContent = label;
    next.appendChild(labelEl);

    var subEl = document.createElement('span');
    subEl.className = 'ws-boot-sub';
    subEl.style.fontFamily = '"JetBrains Mono", monospace';
    subEl.style.fontSize = '11px';
    subEl.style.letterSpacing = '0.05em';
    subEl.style.color = 'rgba(238,240,242,0.45)';
    subEl.textContent = '· ' + sub;
    next.appendChild(subEl);

    statusEl.appendChild(next);
    requestAnimationFrame(function () {
      next.style.opacity = '1';
      next.style.transform = 'translateX(-50%) translateY(0)';
      lines.forEach(function (old) {
        old.style.opacity = '0';
        old.style.transform = 'translateX(-50%) translateY(-3px)';
        setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, FADE_MS + 40);
      });
    });
  }

  function currentText() {
    if (errored) return { label: 'OFFLINE — USING CACHE', sub: 'streamed.pk unreachable' };
    var s = STAGES[Math.min(displayStage, 3)];
    return {
      label: s.label,
      sub: displayStage === 2 && matchCount ? matchCount + ' matches found' : s.sub
    };
  }

  // Display walker — advances on a fixed dwell, capped by realStage.
  setInterval(function () {
    if (finished) return;
    var cap = leaving ? 3 : Math.min(realStage, 3);
    if (displayStage < cap) {
      displayStage += 1;
      lastTickStageChange = performance.now();
      var t = currentText();
      setLine(t.label, t.sub);
    } else if (errored) {
      var t2 = currentText();
      setLine(t2.label, t2.sub);
    }
  }, DWELL_MS);

  // Smooth bar — rAF lerp toward a band-trickled target.
  var last = performance.now();
  function tick() {
    var now = performance.now();
    var dt = Math.min(64, now - last); last = now;
    var s = displayStage;
    var bandStart = (s / 4) * 100;
    var bandEnd   = ((s + 1) / 4) * 100;
    var elapsed = (now - lastTickStageChange) / 1000;
    var trickle = 1 - Math.exp(-elapsed / 0.42);
    var target = bandStart + (bandEnd - bandStart) * (0.05 + 0.9 * trickle);
    if (leaving) target = 100;
    var diff = target - pct;
    var speed = leaving ? 0.009 : 0.006;
    pct += diff * (1 - Math.exp(-speed * dt));
    bar.style.width = pct.toFixed(2) + '%';
    if (!finished) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function leave() {
    if (leaving || finished) return;
    var elapsed = performance.now() - t0;
    var wait = Math.max(0, MIN_MS - elapsed);
    setTimeout(function () {
      leaving = true;
      setTimeout(function () {
        rootEl.style.opacity = '0';
        rootEl.style.transform = 'scale(1.04)';
        setTimeout(function () {
          finished = true;
          if (rootEl.parentNode) rootEl.parentNode.removeChild(rootEl);
        }, 650);
      }, 80);
    }, wait);
  }

  // Hard cap so a hung API never traps the user on the loader.
  setTimeout(function () { if (realStage < 3) { realStage = 3; } leave(); }, CAP_MS);

  window.WS_BOOT = {
    signal: function (s) {
      if (s.error) errored = true;
      if (typeof s.matchCount === 'number') matchCount = s.matchCount;
      if (typeof s.stage === 'number' && s.stage > realStage) realStage = s.stage;
      if (s.done) leave();
      // Refresh the visible text if stage 2's substring (match count) changed.
      if (errored || displayStage === 2) {
        var t = currentText();
        setLine(t.label, t.sub);
      }
    },
    leave: leave
  };
})();
</script>

<script type="text/babel">
function useViewport() {
  const [w, setW] = React.useState(typeof window !== 'undefined' ? window.innerWidth : 1440);
  React.useEffect(() => {
    const onR = () => setW(window.innerWidth);
    window.addEventListener('resize', onR);
    return () => window.removeEventListener('resize', onR);
  }, []);
  return w;
}

function App() {
  const [route, setRoute] = React.useState({ name: 'home', payload: null });
  const [, bump] = React.useReducer(x => x + 1, 0);
  const [streams, setStreams] = React.useState([]);
  const [streamsLoading, setStreamsLoading] = React.useState(false);
  const [apiError, setApiError] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const w = useViewport();
  const isMobile = w < 768;
  const wsboot = (s) => { if (window.WS_BOOT) window.WS_BOOT.signal(s); };

  React.useEffect(() => {
    let timer;
    window.WSToast = (msg, opts) => {
      const o = opts || {};
      // Backwards-compat: a single {actionLabel, onAction} pair becomes a one-item actions array.
      const actions = Array.isArray(o.actions)
        ? o.actions
        : (o.actionLabel && o.onAction ? [{ label: o.actionLabel, onAction: o.onAction }] : []);
      setToast({ msg, k: Date.now(), actions });
      clearTimeout(timer);
      timer = setTimeout(() => setToast(null), 8000);
    };
    return () => { delete window.WSToast; clearTimeout(timer); };
  }, []);

  // Expose navigation globally so MatchCard / SideNav / TopNav etc. can call it.
  React.useEffect(() => {
    window.WS_GO = (name, payload = null) => {
      setRoute({ name, payload });
      window.scrollTo(0, 0);
    };
    return () => { delete window.WS_GO; };
  }, []);

  // Hash routing for refresh / deep-link.
  React.useEffect(() => {
    const apply = () => {
      const h = (window.location.hash || '#home').replace(/^#/, '');
      const valid = ['home', 'detail', 'player', 'schedule', 'search', 'watchlist', 'recent', 'settings'];
      if (valid.includes(h)) setRoute(r => (r.name === h ? r : { name: h, payload: r.payload }));
    };
    apply();
    window.addEventListener('hashchange', apply);
    return () => window.removeEventListener('hashchange', apply);
  }, []);
  React.useEffect(() => {
    if (window.location.hash.replace(/^#/, '') !== route.name) {
      window.history.replaceState(null, '', '#' + route.name);
    }
  }, [route.name, route.payload && route.payload.id]);

  // Initial data load: live + today's upcoming + sport list, merged.
  React.useEffect(() => {
    let cancelled = false;
    wsboot({ stage: 1 });
    (async () => {
      try {
        const [live, today, sports] = await Promise.all([
          window.STREAMED.matches({ filter: 'live' }),
          window.STREAMED.matches({ filter: 'all-today' }).catch(() => []),
          window.STREAMED.sports().catch(() => null),
        ]);
        if (cancelled) return;
        const liveIds = new Set(live.map(m => m.id));
        const merged = live.concat((today || []).filter(m => !liveIds.has(m.id)));
        window.MATCHES.length = 0;
        merged.forEach(m => window.MATCHES.push(m));
        wsboot({ stage: 2, matchCount: merged.length });
        if (sports && sports.length) {
          window.SPORTS.length = 0;
          sports.forEach(s => window.SPORTS.push(s));
        }
        const currentFilter = window.WSStore && window.WSStore.get().sportFilter;
        if (currentFilter && currentFilter !== 'all' && !window.SPORTS.some(s => s.id === currentFilter)) {
          window.WSStore.setSport('all');
        }
        // Pre-warm a handful of poster images so the home grid pops in clean.
        try {
          const toPrewarm = merged.slice(0, 12)
            .map(m => m.poster || (m.posterChain && m.posterChain[0]))
            .filter(Boolean);
          await Promise.race([
            Promise.all(toPrewarm.map(src => new Promise(res => {
              const img = new Image();
              img.onload = img.onerror = () => res();
              img.src = src;
            }))),
            new Promise(res => setTimeout(res, 1500)),
          ]);
        } catch (e) { /* prewarm best-effort */ }
        wsboot({ stage: 3, done: true });
        setApiError(null);
        bump();
      } catch (e) {
        console.warn('[WebStreamer] streamed.pk fetch failed — keeping mock data:', e);
        setApiError(e.message || String(e));
        wsboot({ stage: 3, error: true, done: true });
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Periodic refresh every 60 seconds for live matches.
  React.useEffect(() => {
    const id = setInterval(async () => {
      try {
        const live = await window.STREAMED.matches({ filter: 'live' });
        const liveIds = new Set(live.map(m => m.id));
        const existing = window.MATCHES.filter(m => !m.live);
        const merged = live.concat(existing.filter(m => !liveIds.has(m.id)));
        window.MATCHES.length = 0;
        merged.forEach(m => window.MATCHES.push(m));
        bump();
      } catch (e) {}
    }, 60000);
    return () => clearInterval(id);
  }, []);

  // When entering the player, fetch real streams for the selected match.
  // If rawSources is empty (Streamed often attaches sources between fetches),
  // try refetching the match's live data once before giving up — the source
  // list might have been populated since the home page snapshot.
  React.useEffect(() => {
    if (route.name !== 'player') return;
    const m = route.payload;
    if (!m) { setStreams([]); return; }
    let cancelled = false;
    setStreamsLoading(true);
    setStreams([]);
    (async () => {
      let target = m;
      // Refetch from live if our cached match has no sources.
      if (!target.rawSources || target.rawSources.length === 0) {
        try {
          const fresh = await window.STREAMED.matches({ filter: 'live' });
          if (cancelled) return;
          const refreshed = fresh.find(x => x.id === m.id);
          if (refreshed && refreshed.rawSources && refreshed.rawSources.length > 0) {
            target = refreshed;
          }
        } catch (e) { /* ignore — fall through to allStreams which will return [] */ }
      }
      try {
        const arr = await window.STREAMED.allStreams(target);
        if (cancelled) return;
        setStreams(arr);
        setStreamsLoading(false);
      } catch (e) {
        console.warn('[WebStreamer] stream fetch failed:', e);
        if (!cancelled) { setStreams([]); setStreamsLoading(false); }
      }
    })();
    return () => { cancelled = true; };
  }, [route.name, route.payload && route.payload.id]);

  if (isMobile) {
    let inner;
    switch (route.name) {
      case 'detail':    inner = <MobileMatchDetail match={route.payload}/>; break;
      case 'player':    inner = <MobilePlayer match={route.payload} streams={streams} streamsLoading={streamsLoading}/>; break;
      case 'schedule':  inner = <MobileSchedule/>; break;
      case 'search':    inner = <MobileSearch/>; break;
      case 'watchlist': inner = <MobileWatchlist/>; break;
      case 'recent':    inner = <MobileRecent/>; break;
      case 'settings':  inner = <MobileSettings/>; break;
      default:          inner = <MobileHome/>;
    }
    return (
      <div style={{ width: '100vw', height: '100dvh', overflow: 'hidden', background: '#0a0b0d' }}>
        {inner}
        {apiError && <ApiBanner msg={apiError}/>}
        {toast && <Toast toast={toast} onDismiss={() => setToast(null)}/>}
      </div>
    );
  }

  let screen;
  switch (route.name) {
    case 'detail':    screen = <MatchDetail match={route.payload}/>; break;
    case 'player':    screen = <PlayerFull match={route.payload} streams={streams} streamsLoading={streamsLoading}/>; break;
    case 'schedule':  screen = <ScheduleScreen/>; break;
    case 'search':    screen = <SearchScreen/>; break;
    case 'watchlist': screen = <WatchlistScreen/>; break;
    case 'recent':    screen = <RecentScreen/>; break;
    case 'settings':  screen = <SettingsScreen/>; break;
    case 'home':
    default:          screen = <HomeGrid/>;
  }
  return (
    <div style={{ width: '100vw', height: '100vh', background: '#0a0b0d', position: 'relative' }}>
      {screen}
      {route.name === 'player' && streamsLoading && <StreamLoadingBanner/>}
      {apiError && <ApiBanner msg={apiError}/>}
      {toast && <Toast toast={toast} onDismiss={() => setToast(null)}/>}
    </div>
  );
}

function Toast({ toast, onDismiss }) {
  return (
    <div key={toast.k} style={{
      position: 'fixed', bottom: 'calc(env(safe-area-inset-bottom) + 80px)',
      left: '50%', transform: 'translateX(-50%)',
      maxWidth: 'min(440px, calc(100vw - 32px))',
      padding: '12px 14px',
      background: 'rgba(20,16,8,0.96)',
      border: '1px solid rgba(255,180,100,0.4)',
      borderRadius: 10,
      fontFamily: '"Inter Tight", system-ui',
      fontSize: 13, lineHeight: 1.45, color: '#ffd9b0',
      zIndex: 200, textAlign: 'left',
      boxShadow: '0 12px 32px rgba(0,0,0,0.5)',
      animation: 'ws-toast-in .25s ease-out',
      display: 'flex', flexDirection: 'column', gap: 8,
    }}>
      <div>{toast.msg}</div>
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
        {(toast.actions || []).map((a, i) => (
          <button key={i} onClick={() => { a.onAction(); onDismiss && onDismiss(); }} style={{
            height: 28, padding: '0 12px', borderRadius: 6,
            border: '1px solid rgba(255,180,100,0.6)',
            background: 'rgba(255,180,100,0.18)',
            color: '#ffd9b0', fontFamily: '"Inter Tight", system-ui',
            fontWeight: 600, fontSize: 12, cursor: 'pointer',
          }}>{a.label}</button>
        ))}
        <button onClick={onDismiss} style={{
          height: 28, padding: '0 10px', borderRadius: 6,
          border: '1px solid rgba(255,255,255,0.15)',
          background: 'transparent',
          color: 'rgba(255,217,176,0.7)', fontFamily: '"Inter Tight", system-ui',
          fontSize: 12, cursor: 'pointer',
        }}>Dismiss</button>
      </div>
    </div>
  );
}

function StreamLoadingBanner() {
  return (
    <div style={{
      position: 'fixed', top: 70, left: '50%', transform: 'translateX(-50%)',
      padding: '8px 16px', background: 'rgba(0,0,0,0.85)', borderRadius: 6,
      fontFamily: '"JetBrains Mono"', fontSize: 11, color: '#eef0f2',
      letterSpacing: '0.08em', zIndex: 100, border: '1px solid rgba(255,255,255,0.12)',
    }}>● Loading streams…</div>
  );
}

function ApiBanner({ msg }) {
  return (
    <div style={{
      position: 'fixed', bottom: 16, left: 16, maxWidth: 360, padding: '10px 14px',
      background: 'rgba(40,20,15,0.95)', border: '1px solid rgba(255,180,140,0.3)',
      borderRadius: 6, fontFamily: '"JetBrains Mono"', fontSize: 11,
      color: '#ffd0b8', zIndex: 100, lineHeight: 1.5,
    }}>
      <b>API offline</b> — using mock data.<br/>{msg}<br/>
      <span style={{ opacity: 0.7 }}>Likely CORS or network. Serve via http(s)://, not file://.</span>
    </div>
  );
}

function PinGate({ children }) {
  const [unlocked, setUnlocked] = React.useState(() => window.WSPin && window.WSPin.isUnlocked());
  const [pin, setPin] = React.useState('');
  const [remember, setRemember] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [waitMs, setWaitMs] = React.useState(0);
  const [busy, setBusy] = React.useState(false);

  React.useEffect(() => {
    if (!waitMs) return;
    const id = setInterval(() => {
      const left = window.WSPin.lockoutRemainingMs();
      setWaitMs(left);
      if (left <= 0) { setError(null); clearInterval(id); }
    }, 1000);
    return () => clearInterval(id);
  }, [waitMs]);

  if (unlocked) return children;

  async function submit(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (busy) return;
    setBusy(true);
    setError(null);
    try {
      const r = await window.WSPin.verify(pin, remember);
      if (r.ok) { setUnlocked(true); return; }
      if (r.reason === 'locked') {
        setWaitMs(r.waitMs);
        setError(`Too many attempts. Try again in ${Math.ceil(r.waitMs / 1000)}s.`);
      } else if (r.reason === 'wrong') {
        if (r.waitMs > 0) {
          setWaitMs(r.waitMs);
          setError(`Locked for ${Math.ceil(r.waitMs / 1000)}s after too many attempts.`);
        } else {
          setError('Wrong PIN.');
        }
        setPin('');
      } else {
        setError('Could not verify.');
      }
    } finally { setBusy(false); }
  }

  const locked = waitMs > 0;
  const canSubmit = !busy && !locked && pin.length > 0;

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 10000,
      background: 'radial-gradient(120% 80% at 50% 30%, #11141a 0%, #07080a 60%, #050608 100%)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 24, fontFamily: '"Inter Tight", system-ui',
      color: '#eef0f2',
    }}>
      <form onSubmit={submit} style={{
        width: 'min(380px, 100%)',
        background: 'rgba(20,22,26,0.85)',
        border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 14, padding: 24,
        backdropFilter: 'blur(18px) saturate(160%)',
        boxShadow: '0 16px 48px rgba(0,0,0,0.5)',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 18 }}>
          <div style={{
            width: 32, height: 32, borderRadius: 8,
            background: 'linear-gradient(135deg, oklch(0.78 0.19 155), oklch(0.55 0.14 165))',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="3" y="6" width="8" height="6" rx="1" stroke="#0a1208" strokeWidth="1.6"/>
              <path d="M5 6V4.5a2 2 0 0 1 4 0V6" stroke="#0a1208" strokeWidth="1.6" fill="none"/>
            </svg>
          </div>
          <div style={{ fontSize: 16, fontWeight: 700, letterSpacing: '-0.01em' }}>Enter PIN</div>
        </div>

        <div style={{
          fontFamily: '"JetBrains Mono", monospace', fontSize: 11,
          color: 'rgba(238,240,242,0.55)', lineHeight: 1.5, marginBottom: 16,
        }}>
          This site is private. Enter the PIN to continue. Locked for 5 minutes after 5 wrong attempts.
        </div>

        <input
          type="password"
          autoFocus
          inputMode="numeric"
          value={pin}
          onChange={e => setPin(e.target.value)}
          disabled={locked || busy}
          placeholder="PIN"
          style={inputStyle}
        />

        <label style={{
          display: 'flex', alignItems: 'center', gap: 8, marginTop: 12,
          fontFamily: '"JetBrains Mono", monospace', fontSize: 11,
          color: 'rgba(238,240,242,0.7)', cursor: 'pointer', userSelect: 'none',
        }}>
          <input
            type="checkbox"
            checked={remember}
            onChange={e => setRemember(e.target.checked)}
            style={{ accentColor: 'oklch(0.78 0.19 155)' }}
          />
          Remember on this device for 12 hours
        </label>

        {error && (
          <div style={{
            marginTop: 14, padding: '8px 12px', borderRadius: 6,
            background: 'rgba(255,140,100,0.08)',
            border: '1px solid rgba(255,140,100,0.4)',
            fontFamily: '"JetBrains Mono", monospace', fontSize: 11,
            color: '#ffb499',
          }}>{error}</div>
        )}

        <button
          type="submit"
          disabled={!canSubmit}
          style={{
            width: '100%', height: 40, marginTop: 16,
            borderRadius: 8, border: 'none',
            background: canSubmit ? 'oklch(0.78 0.19 155)' : 'rgba(255,255,255,0.08)',
            color: canSubmit ? '#0a1208' : 'rgba(255,255,255,0.4)',
            fontFamily: '"Inter Tight", system-ui',
            fontWeight: 600, fontSize: 14,
            cursor: canSubmit ? 'pointer' : 'not-allowed',
            transition: 'background .15s',
          }}>
          {locked ? `Locked · ${Math.ceil(waitMs / 1000)}s` : 'Unlock'}
        </button>
      </form>
    </div>
  );
}

const inputStyle = {
  width: '100%', height: 42, padding: '0 14px',
  background: 'rgba(255,255,255,0.04)',
  border: '1px solid rgba(255,255,255,0.12)',
  borderRadius: 8,
  fontFamily: '"JetBrains Mono", monospace', fontSize: 16,
  letterSpacing: '0.18em',
  color: '#eef0f2',
  outline: 'none',
};

ReactDOM.createRoot(document.getElementById('root')).render(<PinGate><App/></PinGate>);
</script>
</body>
</html>
